services:
  postgres:
    image: postgres:16-alpine
    container_name: dfs-postgres
    environment:
      POSTGRES_USER: dfs_user
      POSTGRES_PASSWORD: dfs_password
      POSTGRES_DB: dfs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfs_user -d dfs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dfs_network

  redis:
    image: redis:7-alpine
    container_name: dfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dfs_network

  master-node:
    build:
      context: backend/master_node
      dockerfile: Dockerfile
    container_name: dfs-master-node
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://dfs_user:dfs_password@postgres:5432/dfs_db
      REDIS_URL: redis://redis:6379/0
      ACCESS_SECRET: change_me_access_secret_at_least_32_chars
      REFRESH_SECRET: change_me_refresh_secret_at_least_32_chars
      ACCESS_TOKEN_EXPIRE_M: "15"
      REFRESH_TOKEN_EXPIRE_M: "43200"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dfs_network

  storage-node-1:
    build:
      context: backend/storage_node
      dockerfile: Dockerfile
    container_name: dfs-storage-node-1
    environment:
      STORAGE_NODE_NAME: storage-node-1
      DFS_MASTER_BASE_URL: http://master-node:8001
      STORAGE_PUBLIC_BASE_URL: http://localhost:8002
    ports:
      - "8002:8002"
    volumes:
      - storage_node_1:/storage
    depends_on:
      - redis
      - master-node
    networks:
      - dfs_network

  storage-node-2:
    build:
      context: backend/storage_node
      dockerfile: Dockerfile
    container_name: dfs-storage-node-2
    environment:
      STORAGE_NODE_NAME: storage-node-2
      DFS_MASTER_BASE_URL: http://master-node:8001
      STORAGE_PUBLIC_BASE_URL: http://localhost:8003
    ports:
      - "8003:8002"
    volumes:
      - storage_node_2:/storage
    depends_on:
      - redis
      - master-node
    networks:
      - dfs_network

  storage-node-3:
    build:
      context: backend/storage_node
      dockerfile: Dockerfile
    container_name: dfs-storage-node-3
    environment:
      STORAGE_NODE_NAME: storage-node-3
      DFS_MASTER_BASE_URL: http://master-node:8001
      STORAGE_PUBLIC_BASE_URL: http://localhost:8004
    ports:
      - "8004:8002"
    volumes:
      - storage_node_3:/storage
    depends_on:
      - redis
      - master-node
    networks:
      - dfs_network

volumes:
  postgres_data:
  storage_node_1:
  storage_node_2:
  storage_node_3:

networks:
  dfs_network:
    driver: bridge
